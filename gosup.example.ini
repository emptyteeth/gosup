; gosup example configuration
;
; The configuration can be hot-reloaded after changes:
;   gosup -c /etc/gosup.ini reload              (update the configuration only, without interrupting running processes)
;   gosup -c /etc/gosup.ini reload --restart    (restart programs whose startup arguments changed)
;   kill -HUP <gosup pid>                       (equivalent to reload; the result is written to the log)
; Syntax: ini
;   - key names are case-insensitive
;   - values may be wrapped in double quotes; inside them ";" is not treated as a comment
;   - an unquoted inline ";" is not a comment (semicolons in command are safe to use)
;
; Durations: 10 means 10 seconds; 500ms / 2m / 1h are also supported
; Capabilities: net_bind_service, CAP_NET_BIND_SERVICE, 10, all

[daemon]
; HTTP listen address (POST /rpc, GET /events SSE)
listen = 127.0.0.1:9595

; Set the access password with one of: password, password_sha256, allow_no_auth = true
; Generate a digest: gosup hash-password 'your-password'
password = change-me
; password_sha256 = hex SHA-256 digest (64 characters), see the comment above
; password_file = /etc/gosup.password
; allow_no_auth = false

; Optional TLS (enables https when configured)
; tls_cert = /etc/gosup/server.crt
; tls_key  = /etc/gosup/server.key

pid_file = /run/gosup/gosup.pid
log_file = /run/gosup/gosup.log
state_dir = /run/gosup/state
log_level = info

stop_timeout = 10
shutdown_timeout = 30

; Bytes retained for each program's stdout / stderr (the oldest data is dropped on overflow)
output_buffer_bytes = 262144

; Upper limit on concurrent SSE log streams (0 means unlimited).
; Each log follow is one long-lived connection, reclaimed as soon as it disconnects.
max_connections = 16

[program:web]
command = /bin/sh -c 'i=0; while true; do i=$((i+1)); echo "stdout line $i"; echo "stderr line $i" >&2; sleep 1; done'
; shell = true
workdir = /tmp
enabled = true
restart = always
restart_delay = 1
restart_max = 5
stable_after = 60

[program:once]
command = /bin/sh -c 'echo hello from once; sleep 0.2; exit 3'
enabled = false
restart = on-failure
restart_delay = 2

[program:privileged]
; Run as the specified identity (requires gosup to be started as root)
; This can be a user name, or a numeric id written directly (on Android it must be numeric:
; an app uid is not in /etc/passwd, and Go's os/user cannot look it up on Android)
user = nobody
group = nobody
; capabilities = net_bind_service, net_raw
command = /usr/bin/id
enabled = false
restart = never
stdout = /var/log/privileged.out
stderr = ring
